<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Manas Maahir. ML researcher and developer. Animated chart: a training run collapses after an early-warning alert fires.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="650" y="60" width="0" height="200">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
                 values="0;490;490;0" keyTimes="0;0.7;0.99;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- identity -->
  <text x="64" y="112" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#0969da">&gt; ml researcher &amp; developer</text>
  <rect x="326" y="98" width="9" height="18" fill="#0969da">
    <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/>
  </rect>
  <text x="62" y="178" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#1f2328">Manas Maahir</text>
  <text x="64" y="218" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" fill="#57606a">Training dynamics · Continual learning · Reliable AI</text>
  <text x="64" y="252" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#8c959f">Catching neural networks before they fail.</text>

  <!-- chart panel -->
  <rect x="628" y="30" width="536" height="266" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="650" y="54" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8c959f">training run</text>
  <line x1="930" y1="50" x2="950" y2="50" stroke="#0969da" stroke-width="2.5"/>
  <text x="956" y="54" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606a">val loss</text>
  <line x1="1030" y1="50" x2="1050" y2="50" stroke="#8250df" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="1056" y="54" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606a">entropy</text>
  <line x1="650" y1="90" x2="1140" y2="90" stroke="#eaeef2" stroke-width="1"/><line x1="650" y1="130" x2="1140" y2="130" stroke="#eaeef2" stroke-width="1"/><line x1="650" y1="170" x2="1140" y2="170" stroke="#eaeef2" stroke-width="1"/><line x1="650" y1="210" x2="1140" y2="210" stroke="#eaeef2" stroke-width="1"/><line x1="650" y1="250" x2="1140" y2="250" stroke="#eaeef2" stroke-width="1"/>

  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.03;0.92;1"/>
    <g clip-path="url(#reveal)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M650,130 C700,124 740,134 790,127 S870,122 900,128 C930,140 960,170 1000,195 S1080,228 1140,236" stroke="#8250df" stroke-width="2.5" stroke-dasharray="6 4"/>
      <path d="M650,95 C700,150 760,180 830,198 S930,214 980,214 C1000,214 1010,210 1020,200 L1035,212 L1050,170 L1062,185 L1078,130 L1092,150 L1110,95 L1125,110 L1140,80" stroke="#0969da" stroke-width="3"/>
    </g>

    <!-- NDEWS alert: the entropy signal has started to fall while loss still looks fine -->
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.4;0.42;0.92;1"/>
      <line x1="930" y1="66" x2="930" y2="250" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="930" cy="142" r="5" fill="#9a6700"/>
      <circle cx="930" cy="142" r="5" fill="none" stroke="#9a6700" stroke-width="2">
        <animate attributeName="r" dur="1.2s" repeatCount="indefinite" values="5;16"/>
        <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="0.9;0"/>
      </circle>
      <path d="M820,79 l7,-12 l7,12 z" fill="#9a6700"/>
      <text x="827" y="78" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff">!</text>
      <text x="922" y="79" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#9a6700">NDEWS alert</text>
    </g>

    <!-- collapse: the loss finally reacts -->
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.529;0.549;0.92;1"/>
      <line x1="1020" y1="66" x2="1020" y2="250" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="1028" y="79" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#cf222e">collapse</text>
    </g>

    <!-- lead time between alert and collapse -->
    <g opacity="0" stroke="#57606a" stroke-width="1.5">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.569;0.589;0.92;1"/>
      <line x1="930" y1="264" x2="1020" y2="264"/>
      <line x1="930" y1="258" x2="930" y2="270"/>
      <line x1="1020" y1="258" x2="1020" y2="270"/>
      <text x="975" y="286" text-anchor="middle" stroke="none" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606a">lead time</text>
    </g>
  </g>
</svg>
